plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    signingConfigs {
        release {
            // storeFile file('C:\\Users\\jerem\\Google Drive\\PlayStore\\meteocool.jks')
        }
    }
    compileSdk 36

    defaultConfig {
        applicationId "com.meteocool"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 36
        versionName "4.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        // Lets Android 13+ offer the app's languages in its language setting.
        generateLocaleConfig true
        // The languages of the countries with radar coverage. Libraries bring
        // dozens more, which would leave a half-translated app in those.
        localeFilters += ["en", "de", "fr", "it", "cs", "pl"]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    flavorDimensions = ["default"]
    productFlavors {
        create("gms") {
            dimension "default"
            // Where "Share meteocool" points: the store this build came from.
            buildConfigField "String", "STORE_URL", '"https://play.google.com/store/apps/details?id=com.meteocool"'
        }
        create("fdroid") {
            dimension "default"
            buildConfigField "String", "STORE_URL", '"https://f-droid.org/packages/com.meteocool/"'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace 'com.meteocool'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'

    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // JSON
    implementation 'com.google.code.gson:gson:2.13.2'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Fused location and push, Google Play builds only
    gmsImplementation 'com.google.android.gms:play-services-location:21.3.0'
    gmsImplementation platform('com.google.firebase:firebase-bom:34.4.0')
    gmsImplementation 'com.google.firebase:firebase-messaging'
    gmsImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // debugImplementation because LeakCanary should only run in debug builds.
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}

if (getGradle().getStartParameter().getTaskRequests().toString().contains("Gms")) {
    apply plugin: 'com.google.gms.google-services'
}
